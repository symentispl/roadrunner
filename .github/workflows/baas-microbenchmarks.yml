name: Microbenchmarks (BaaS)

on:
  workflow_dispatch:

concurrency:
  group: baas-microbenchmarks
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build benchmarks jar
        run: ./mvnw -B -q package -DskipTests -pl roadrunner-microbenchmarks -am

      - name: Install BaaS
        run: |
          curl -fsSLo "$RUNNER_TEMP/baas-install.sh" https://github.com/wsztajerowski/benchmark-as-a-service/releases/download/v8.0.0/install.sh
          sh "$RUNNER_TEMP/baas-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.BAAS_OPERATOR_ROLE_ARN }}
          aws-region: ${{ vars.BAAS_AWS_REGION }}
          role-duration-seconds: 9000
          role-session-name: GitHubActions

      - name: Run microbenchmarks on EC2
        run: |
          baas run jmh-with-async \
            --benchmark-jar roadrunner-microbenchmarks/target/benchmarks.jar \
            --project roadrunner \
            --tag "commit=$GITHUB_SHA" \
            --tag "branch=$GITHUB_REF_NAME" \
            --detach -- --async-interval 1000000 --async-event=cpu roadrunner
